# Blueprint do Render para a API (https://render.com/docs/blueprint-spec).
# Banco (Neon) e Redis (Upstash) ficam fora do Render: cole as URLs nas variáveis marcadas sync: false.
services:
  - type: web
    name: nexus-shop-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SETTINGS_ENCRYPTION_KEY
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: COOKIE_SAME_SITE
        value: lax
      # Vitrine de portfólio: contas de demonstração na tela de login (desligue com false)
      - key: DEMO_ACCOUNTS
        value: "true"
      # Opcionais, adicione depois no painel do Render quando for usar:
      # SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM (e-mails da loja)
      # MERCADOPAGO_WEBHOOK_SECRET, STRIPE_WEBHOOK_SECRET (webhooks de pagamento)
