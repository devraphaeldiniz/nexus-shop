name: Nexus Shop CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: API — lint, typecheck e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: nexus_test_pass
          POSTGRES_DB: nexus_shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      TEST_DATABASE_URL: postgresql://nexus_test:nexus_test_pass@localhost:5432/nexus_shop_test?schema=public
      DATABASE_URL: postgresql://nexus_test:nexus_test_pass@localhost:5432/nexus_shop_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: github-actions-test-access-token-secret-32-chars!
      JWT_REFRESH_SECRET: github-actions-test-refresh-token-secret-32-chars!
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test

  client:
    name: Front — lint, typecheck e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [server, client]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: nexus_password123
          POSTGRES_DB: nexus_shop_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://nexus_user:nexus_password123@localhost:5433/nexus_shop_e2e?schema=public
      SEED_ADMIN_PASSWORD: AdminE2e12345
      SEED_CUSTOMER_PASSWORD: ClienteE2e12345
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar API
        working-directory: server
        run: |
          npm ci
          npx prisma migrate deploy
          npm run prisma:seed
      - name: Preparar front
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Rodar E2E
        working-directory: client
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report

  security-audit:
    name: Auditoria de dependências (informativa)
    runs-on: ubuntu-latest
    # Não bloqueia o merge: o resultado aparece no resumo do job para acompanhamento
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd server && npm audit --omit=dev --audit-level=high
      - run: cd client && npm audit --omit=dev --audit-level=high

  docker:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    needs: [server, client]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nexus-shop-api ./server
      - run: docker build -t nexus-shop-client --build-arg NEXT_PUBLIC_API_URL=https://api.example.com/api/v1 ./client
