name: Nexus Shop CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install & Check Server
        run: |
          cd server
          npm ci
          npm run typecheck || true
          npm run lint || true

      - name: Install & Check Client
        run: |
          cd client
          npm ci
          npm run typecheck || true
          npm run lint || true

  test-backend:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: nexus_test_pass
          POSTGRES_DB: nexus_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://nexus_test:nexus_test_pass@localhost:5432/nexus_test_db?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: github-actions-test-access-token-secret-32-chars!
          JWT_REFRESH_SECRET: github-actions-test-refresh-token-secret-32-chars!
          NODE_ENV: test
        run: |
          cd server
          npm ci
          npx prisma generate
          npm run test

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Backend Dependencies
        run: |
          cd server
          npm audit --audit-level=high || true
      - name: Audit Frontend Dependencies
        run: |
          cd client
          npm audit --audit-level=high || true

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [test-backend, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Server
        run: |
          cd server
          npm ci
          npm run build
      - name: Build Client
        run: |
          cd client
          npm ci
          npm run build
